site_name: speak5220
site_description: The Texas Instruments TMS5220 voice synthesis processor, measured on real hardware
site_url: https://simoninns.github.io/speak5220/
repo_url: https://github.com/simoninns/speak5220
repo_name: simoninns/speak5220
edit_uri: edit/main/docs/
copyright: Copyright &copy; Simon Inns

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
    - content.action.view
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Light mode

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra_css:
  - stylesheets/extra.css

plugins:
  - search

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - Home: index.md
  - Application:
      - application/index.md
      - Getting started: application/getting-started.md
      - User manual:
          - Projects and phrases: application/user-manual/projects.md
          - The main window: application/user-manual/main-window.md
          - Waveforms and playback: application/user-manual/waveforms.md
          - The encoder and Optimise: application/user-manual/encoder.md
          - Export: application/user-manual/export.md
          - BBC Micro disc: application/user-manual/bbc-disc.md
          - Command-line tool: application/user-manual/cli.md
          - Troubleshooting: application/user-manual/troubleshooting.md
      - Reference:
          - Project file: application/reference/project-file.md
          - Command-line options: application/reference/cli-options.md
          - Encoder options: application/reference/encoder-options.md
          - Export formats: application/reference/export-formats.md
  - Technical:
      - technical/index.md
      - Reference datasheet:
          - technical/datasheet/index.md
          - System clock: technical/datasheet/clock.md
          - CPU interface: technical/datasheet/cpu-interface.md
          - VSM interface: technical/datasheet/vsm-interface.md
          - I/O structure: technical/datasheet/io-structure.md
          - Commands: technical/datasheet/commands.md
          - Power-up and between utterances: technical/datasheet/power-up.md
          - Coded speech parameters: technical/datasheet/coded-parameters.md
          - DAC and audio output: technical/datasheet/dac-and-audio.md
          - Serial sample output: technical/datasheet/serial-output.md
          - Frame timing: technical/datasheet/frame-timing.md
          - Excitation and interpolation: technical/datasheet/excitation-interpolation.md
          - Lattice filter: technical/datasheet/lattice-filter.md
          - Reference algorithm: technical/datasheet/reference-algorithm.md
          - PROM OUT: technical/datasheet/prom-out.md
          - Electrical characteristics: technical/datasheet/electrical.md
          - Pin functions: technical/datasheet/pins.md
          - Authoring speech data: technical/datasheet/authoring.md
          - Known gaps: technical/datasheet/gaps.md
      - Emulator:
          - technical/emulator/index.md
          - API: technical/emulator/api.md
          - Command line: technical/emulator/command-line.md
          - Implementation choices: technical/emulator/choices.md
      - Encoder:
          - technical/encoder/index.md
          - How it works: technical/encoder/how-it-works.md
          - Quality: technical/encoder/quality.md
          - Implementation choices: technical/encoder/choices.md
          - How TI encoded speech: technical/encoder/ti-encoder.md
      - Original documents:
          - technical/sources/index.md
          - TMS 5220 data manual:
              - technical/sources/tms5220-data-manual/index.md
              - Introduction, interface and commands: technical/sources/tms5220-data-manual/introduction-and-commands.md
              - Speech synthesis: technical/sources/tms5220-data-manual/speech-synthesis.md
              - Electrical and mechanical data: technical/sources/tms5220-data-manual/electrical-and-mechanical.md
              - Appendices: technical/sources/tms5220-data-manual/appendices.md
              - Coding table: technical/sources/tms5220-data-manual/coding-table.md
          - TMS 6100 data manual: technical/sources/tms6100-data-manual/index.md
          - US patent 4,335,277:
              - technical/sources/patent-us4335277/index.md
              - Drawings: technical/sources/patent-us4335277/drawings.md
              - Description: technical/sources/patent-us4335277/description.md
              - Synthesizer logic diagrams: technical/sources/patent-us4335277/logic-diagrams.md
              - Alternative embodiments: technical/sources/patent-us4335277/alternative-embodiments.md
              - Claims: technical/sources/patent-us4335277/claims.md
