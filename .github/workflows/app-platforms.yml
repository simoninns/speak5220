#
# Builds and tests the Speak5220 application (app/) on Windows (MSVC) and
# macOS. These jobs do not run on every push: only when started by hand from
# the Actions tab, or for a release tag (v*) from release.yml, which also
# asks for the installers: after the tests pass, a second build makes the
# Windows MSI or the macOS DMG (app/cmake/Packaging.cmake). Qt comes from
# aqtinstall, pinned to the version in the Nix flake; the other libraries
# come from vcpkg, pinned by the baseline in app/vcpkg.json, so the builds
# do not drift from the Nix one between releases; vcpkg builds them from
# source on each run. Uses only free services: GitHub's hosted runners and
# the Qt cache in the GitHub Actions cache.
name: Application (Windows and macOS)

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        description: Build the installers after the tests
        type: boolean
        default: false
      version:
        description: The installers' version, MAJOR.MINOR.PATCH
        type: string
        default: "0.0.0"

permissions:
  contents: read

concurrency:
  group: app-platforms-${{ github.ref }}
  cancel-in-progress: true

env:
  # The Qt version of the Nix flake's nixpkgs (qtbase)
  QT_VERSION: "6.11.2"
  # WiX, for the MSI: the .NET tool and the UI extension CPack's template
  # uses, at matching versions
  WIX_VERSION: "4.0.4"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      # aqtinstall 3.3.0, the latest release, cannot find Qt 6.11 for Windows
      # (its packages moved to per-compiler directories); its master branch
      # can (aqtinstall #1000). Pinned to a commit until a release has it.
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          # Qt Multimedia plays the audio
          modules: qtmultimedia
          cache: true
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@076e1659807d0b362a3ed684d54c2e9c775eb9c7
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: app/vcpkg.json
      - name: Configure
        shell: bash
        run: >
          cmake -S app -B build/app -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/app"
          -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
      - name: Build
        run: cmake --build build/app
      - name: Unit tests
        run: ctest --test-dir build/app -L unit --output-on-failure
      # The GUI tests choose the offscreen platform themselves
      - name: Functional tests
        run: ctest --test-dir build/app -L functional --output-on-failure

      # The installers. The libraries are linked statically, so only Qt is
      # bundled (app/cmake/Packaging.cmake). The DMG is universal (arm64
      # and x86_64, as Qt's binaries are) for macOS 13 or later, Qt 6.11's
      # oldest.
      - name: Install WiX
        if: inputs.package && runner.os == 'Windows'
        shell: bash
        run: |
          dotnet tool install --global wix --version "$WIX_VERSION"
          wix="$USERPROFILE/.dotnet/tools/wix"
          "$wix" extension add --global "WixToolset.UI.wixext/$WIX_VERSION"
          "$wix" --version
      - name: Configure the installer build
        if: inputs.package
        shell: bash
        env:
          PACKAGE_VERSION: ${{ inputs.version }}
        run: |
          if [[ $RUNNER_OS == Windows ]]; then
            platform=(-DVCPKG_TARGET_TRIPLET=x64-windows-static-md)
          else
            platform=(
              -DVCPKG_TARGET_TRIPLET=universal-osx
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
              -DCMAKE_OSX_DEPLOYMENT_TARGET=13.3
            )
          fi
          cmake -S app -B build/package -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_DIR="$GITHUB_WORKSPACE/app" \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DSPEAK5220_BUILD_TESTS=OFF -DSPEAK5220_PACKAGE=ON \
            -DSPEAK5220_PACKAGE_VERSION="$PACKAGE_VERSION" "${platform[@]}"
      - name: Build the installer build
        if: inputs.package
        run: cmake --build build/package
      # hdiutil, which makes the DMG, sometimes fails on GitHub's macOS
      # runners with "Resource busy", so it is tried three times
      - name: Make the installer
        if: inputs.package
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if cpack --config build/package/CPackConfig.cmake \
              -B build/package/installer; then
              exit 0
            fi
            echo "cpack failed (attempt $attempt)"
            sleep 10
          done
          exit 1
      - name: Upload the installer
        if: inputs.package
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: build/package/installer/Speak5220-*
          if-no-files-found: error
