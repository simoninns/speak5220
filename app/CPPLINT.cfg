#
# cpplint settings for app/.
set noparent
linelength=80
root=src

# The checks below are disabled because they conflict with the project's
# agreed rules:
#   build/header_guard  cpplint cannot add the SPEAK5220_ prefix;
#                       app/scripts/check-header-guards.sh checks guards instead.
#   readability/todo    AGENTS.md §4.3.7 writes "// TODO: <description>"
#                       without a user name.
#   build/c++11, build/c++17
#                       flag standard headers (<thread>, <mutex>, <filesystem>)
#                       that C++20 code is free to use.
#   whitespace/indent_namespace
#                       mistakes the continuation lines of a multi-line brace
#                       initializer at namespace scope for indented
#                       declarations; clang-format owns indentation.
filter=-build/header_guard,-readability/todo,-build/c++11,-build/c++17,-whitespace/indent_namespace
